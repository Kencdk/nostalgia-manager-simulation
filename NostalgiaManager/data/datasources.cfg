# Database source files for Nostalgia Manager Simulation.
#
# Use the 'database' key to load teams and players from a single SQLite DB:
#   database = D:\DEV\Docs\NMS.DB
#
# Alternatively, point at CSV files (Championship Manager / FM style exports):
#   players = PlayersDB.csv
#   teams   = ClubsDB.csv
#
# Relative paths are resolved against this data/ folder; absolute paths are
# fine on Windows. Lines starting with # are comments.

database = Data.db

formations = TeamsDB.csv

# To fall back to CSV files instead, comment out the 'database' line above and
# uncomment the lines below:
# players = PlayersDB.csv
# teams   = ClubsDB.csv
